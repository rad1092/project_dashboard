[theme]
base = "light"
primaryColor = "#2f8f83"
backgroundColor = "#f5efe4"
secondaryBackgroundColor = "#fffaf2"
textColor = "#2d3129"
font = "serif"
showSidebarBorder = true

[theme.sidebar]
